<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Form</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1d4ed8, #14b8a6);
      overflow: hidden;
    }

    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      animation: float 6s infinite ease-in-out;
    }

    .circle-one {
      width: 180px;
      height: 180px;
      top: 80px;
      left: 80px;
    }

    .circle-two {
      width: 250px;
      height: 250px;
      bottom: -70px;
      right: -50px;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-25px);
      }
    }

    .login-box {
      width: 400px;
      padding: 35px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 25px;
      backdrop-filter: blur(18px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: white;
      z-index: 10;
    }

    .login-box h1 {
      text-align: center;
      font-size: 34px;
      margin-bottom: 10px;
    }

    .login-box p {
      text-align: center;
      color: #dbeafe;
      margin-bottom: 30px;
      font-size: 15px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      border: none;
      outline: none;
      border-radius: 12px;
      font-size: 15px;
      background: rgba(255, 255, 255, 0.95);
      color: #0f172a;
    }

    .input-group input:focus {
      box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.5);
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .options label {
      cursor: pointer;
    }

    .options a,
    .signup-text a {
      color: #bae6fd;
      text-decoration: none;
      font-weight: bold;
    }

    .options a:hover,
    .signup-text a:hover {
      text-decoration: underline;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #14b8a6, #22c55e);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(20, 184, 166, 0.4);
    }

    .signup-text {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #e0f2fe;
    }

    @media (max-width: 480px) {
      .login-box {
        width: 90%;
        padding: 25px;
      }

      .login-box h1 {
        font-size: 28px;
      }

      .options {
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <div class="circle circle-one"></div>
  <div class="circle circle-two"></div>

  <div class="login-box">
    <h1>Welcome Back</h1>
    <p>Login to continue your journey</p>

    <form>
      <div class="input-group">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          placeholder="Enter your email" 
          required
        />
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          placeholder="Enter your password" 
          required
        />
      </div>

      <div class="options">
        <label>
          <input type="checkbox" />
          Remember me
        </label>

        <a href="#">Forgot Password?</a>
      </div>

      <button type="submit" class="login-btn">Login</button>

      <div class="signup-text">
        Don’t have an account? <a href="#">Create Account</a>
      </div>
    </form>
  </div>

</body>
</html>
